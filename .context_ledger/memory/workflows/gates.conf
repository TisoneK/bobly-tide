# Gate command registry (project-owned; copy/update after bootstrap)
#
# Commands are executed from the project repository root by
# .context_ledger/core/bin/ledger-gates. Keep secrets out of this file.
#
# mode=hybrid means explicit commands below run first; when a gate has no
# explicit project commands, the helper discovers conventional package.json
# scripts or Python checks. Set mode=explicit to fail when a gate has no
# configured project command.
mode=hybrid

# One command per line: <gate>|<command>
# Gates: checkpoint, pre-commit, integration, exit
#
# Backend gate (see backend/scripts/gate.sh): pre-commit typechecks (fast,
# only when backend/ is staged); integration and exit run the full test
# suite. CI runs the full suite too (.github/workflows/backend-tests.yml).
pre-commit|sh backend/scripts/gate.sh pre-commit
integration|sh backend/scripts/gate.sh full
exit|sh backend/scripts/gate.sh full
