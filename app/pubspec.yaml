name: bobly_tide
description: Bobly Tide — pilot mobile client (Flutter).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  # On-device KYC: Smile ID runs the selfie/ID capture + liveness and uploads
  # straight to the vendor (ADR-19). Version verified against pub.dev on
  # 2026-10-26: `^10.0.0` resolves to 10.4.3 (11.2.14 is the latest major; a
  # bump needs a deliberate migration of the widget API, not a constraint edit).
  smile_id: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
